version: "3.9"
services:
  brain-foundry:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    ports:
      - "6120:6120"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BRAIN_MODEL=${BRAIN_MODEL:-claude-sonnet-4-6}
      - PORT=6120
    volumes:
      # Mount for local dev hot-reload (optional)
      - ./api-server:/app/api-server:ro
    restart: unless-stopped
    shm_size: 256mb   # Chromium needs shared memory
